
<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none">
    <rect x="0.5" y="0.5" width="494" height="194" rx="4.5" fill="#000000" stroke="none"/>
    
    <style>
        .stat { font: 700 28px 'Segoe UI', Ubuntu, Sans-Serif; fill: #ffffff; }
        .label { font: 400 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #ffffff; }
        .streak-label { font: 600 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #bf00ff; }
        .date { font: 400 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #9e9e9e; }
        .divider { stroke: #ffffff; stroke-opacity: 0.2; stroke-width: 1; }
        .ring { stroke: #bf00ff; stroke-width: 4.5; fill: none; }
        .fire { fill: #bf00ff; }
    </style>

    <!-- Total Contributions -->
    <g transform="translate(82, 85)" text-anchor="middle">
        <text class="stat">1455</text>
        <text y="25" class="label">Total Contributions</text>
        <text y="45" class="date">May 03, 2021 - Present</text>
    </g>

    <!-- Vertical Dividers -->
    <line x1="165" y1="40" x2="165" y2="155" class="divider"/>
    <line x1="330" y1="40" x2="330" y2="155" class="divider"/>

    <!-- Current Streak -->
    <g transform="translate(247.5, 95)" text-anchor="middle">
        <circle r="44" class="ring"/>
        <!-- Fire Icon on top of ring -->
        <path class="fire" d="M9.8 1.8c0 0-1.8 3.5-1.8 5.3s.9 1.8.9 1.8 1-.9 1-1.8 1.8-.9 1.8-.9.9 2.6.9 4.4-1.8 4.4-4.4 4.4-4.4-1.8-4.4-4.4 1.8-5.3 4.4-8.8z" transform="translate(-11, -62) scale(1.4)"/>
        <text class="stat" y="8">18</text>
        <text y="60" class="streak-label">Current Streak</text>
        <text y="80" class="date">Apr 19 - May 06</text>
    </g>

    <!-- Longest Streak -->
    <g transform="translate(413, 85)" text-anchor="middle">
        <text class="stat">18</text>
        <text y="25" class="label">Longest Streak</text>
        <text y="45" class="date">Apr 19 - May 06</text>
    </g>
</svg>
