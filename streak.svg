
<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none">
    <style>
        .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #a600ff; }
        .stat { font: 800 32px 'Segoe UI', Ubuntu, Sans-Serif; fill: #ffffff; }
        .label { font: 400 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #ffffff; }
        .fire { fill: #a600ff; }
    </style>
    
    <rect x="0.5" y="0.5" width="494" height="194" rx="4.5" fill="#000000" stroke="none"/>
    
    <!-- Total Contributions -->
    <g transform="translate(40, 40)">
        <text x="0" y="20" class="label">Total Contributions</text>
        <text x="0" y="65" class="stat">1453</text>
    </g>
    
    <!-- Current Streak -->
    <g transform="translate(190, 40)">
        <text x="0" y="20" class="label">Current Streak</text>
        <text x="0" y="65" class="stat">18</text>
        <path class="fire" d="M11 2c0 0-2 4-2 6s1 2 1 2 1-1 1-2 2-1 2-1 1 3 1 5-2 5-5 5-5-2-5-5 2-6 5-10z" transform="translate(100, 40) scale(1.5)"/>
    </g>
    
    <!-- Longest Streak -->
    <g transform="translate(340, 40)">
        <text x="0" y="20" class="label">Longest Streak</text>
        <text x="0" y="65" class="stat">18</text>
    </g>
    
    <!-- Decorative Ring -->
    <circle cx="450" cy="150" r="20" stroke="#a600ff" stroke-width="4" fill="none" opacity="0.5"/>
    <circle cx="450" cy="150" r="10" fill="#a600ff" opacity="0.8"/>
</svg>
