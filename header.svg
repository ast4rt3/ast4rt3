<svg xmlns="http://www.w3.org/2000/svg" width="600" height="80">
  <style>
    .title {
      font-family: 'Courier New', Courier, monospace;
      font-size: 42px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .base { fill: #8c00ff; }
    .glitch-r { fill: #ff0055; opacity: 0; animation: glitch-r 4s infinite; }
    .glitch-b { fill: #00f0ff; opacity: 0; animation: glitch-b 4s infinite; }

    /* RGB Split Glitch Effect */
    @keyframes glitch-r {
      0%, 92% { opacity: 0; transform: translate(0, 0); }
      93% { opacity: 0.7; transform: translate(-4px, 2px); }
      95% { opacity: 0.7; transform: translate(3px, -2px); }
      97% { opacity: 0.7; transform: translate(-2px, 0px); }
      99% { opacity: 0; transform: translate(0, 0); }
    }
    @keyframes glitch-b {
      0%, 92% { opacity: 0; transform: translate(0, 0); }
      93% { opacity: 0.7; transform: translate(4px, -2px); }
      95% { opacity: 0.7; transform: translate(-3px, 2px); }
      97% { opacity: 0.7; transform: translate(2px, 0px); }
      99% { opacity: 0; transform: translate(0, 0); }
    }

    /* System Flicker Effect */
    @keyframes flicker {
      0%, 90% { opacity: 1; }
      91% { opacity: 0.5; }
      93% { opacity: 1; }
      95% { opacity: 0.3; }
      97% { opacity: 1; }
    }
    .base { animation: flicker 4s infinite; }
  </style>

  <!-- Transparent Background -->
  <rect width="600" height="80" fill="transparent" />

  <g transform="translate(300, 40)">
    <!-- Glitch Layers -->
    <text class="title glitch-r">I AM LAWRENCE HERAS</text>
    <text class="title glitch-b">I AM LAWRENCE HERAS</text>
    <!-- Main Layer -->
    <text class="title base">I AM LAWRENCE HERAS</text>
  </g>
</svg>
