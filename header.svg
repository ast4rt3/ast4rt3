<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="160" viewBox="0 0 1000 160">
  <style>
    .title {
      font-family: 'Courier New', Courier, monospace;
      font-size: 42px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
      fill: #8c00ff;
    }

    /* Border: Left, Top, Right only. No Bottom. */
    .frame-border { fill: #0a0a0a; stroke: #8c00ff; stroke-width: 2; }
    .title-txt { font-family: 'Courier New', monospace; font-size: 12px; fill: #8c00ff; font-weight: bold; }
    
    @keyframes frame-glitch {
      0%, 90% { opacity: 1; transform: translate(0); }
      92% { opacity: 0.8; transform: translate(-2px, 1px); }
      94% { opacity: 1; transform: translate(2px, -1px); }
      100% { transform: translate(0); }
    }
    .glitch-frame { animation: frame-glitch 6s infinite; }

    /* Header animations */
    .base { animation: base-hide 9s infinite; }
    .sl-1 { clip-path: inset(0 0 75% 0);   opacity:0; animation: sl-1 9s infinite; }
    .sl-2 { clip-path: inset(25% 0 50% 0); opacity:0; animation: sl-2 9s infinite; }
    .sl-3 { clip-path: inset(50% 0 25% 0); opacity:0; animation: sl-3 9s infinite; }
    .sl-4 { clip-path: inset(75% 0 0 0);   opacity:0; animation: sl-4 9s infinite; }
    .ec-t1 { opacity:0; animation: ec-t1 9s infinite; }
    .ec-t2 { opacity:0; animation: ec-t2 9s infinite; }
    .ec-b1 { opacity:0; animation: ec-b1 9s infinite; }
    .ec-b2 { opacity:0; animation: ec-b2 9s infinite; }
    .sw-l   { opacity:0; animation: sw-l  9s infinite; }
    .sw-r   { opacity:0; animation: sw-r  9s infinite; }
    .sw-l2  { opacity:0; animation: sw-l2 9s infinite; }
    .sw-r2  { opacity:0; animation: sw-r2 9s infinite; }
    .sw-sl1 { clip-path: inset(10% 0 60% 0); opacity:0; animation: sw-sl1 9s infinite; }
    .sw-sl2 { clip-path: inset(55% 0 10% 0); opacity:0; animation: sw-sl2 9s infinite; }
    .glitch-r { fill: #ff0055; opacity:0; animation: glitch-r 9s infinite; }
    .glitch-b { fill: #00f0ff; opacity:0; animation: glitch-b 9s infinite; }

    @keyframes base-hide { 0%,14%{opacity:1;} 15%,15.3%{opacity:0;} 15.4%,47%{opacity:1;} 48%,49%{opacity:0;} 49.1%,79%{opacity:1;} 80%{opacity:.4;} 81%{opacity:1;} 82%{opacity:.2;} 83%,100%{opacity:1;} }
    @keyframes sl-1 { 0%,14.9%{opacity:0;transform:translate(0);} 15%{opacity:1;transform:translate(-22px,0);} 15.3%,100%{opacity:0;transform:translate(0);} }
    @keyframes sl-2 { 0%,14.9%{opacity:0;transform:translate(0);} 15%{opacity:1;transform:translate(20px,0);} 15.3%,100%{opacity:0;transform:translate(0);} }
    @keyframes sl-3 { 0%,14.9%{opacity:0;transform:translate(0);} 15%{opacity:1;transform:translate(-26px,0);} 15.3%,100%{opacity:0;transform:translate(0);} }
    @keyframes sl-4 { 0%,14.9%{opacity:0;transform:translate(0);} 15%{opacity:1;transform:translate(22px,0);} 15.3%,100%{opacity:0;transform:translate(0);} }
    @keyframes ec-t1 { 0%,14.9%{opacity:0;transform:translate(0,0) scale(1);} 15%{opacity:.6;transform:translate(0,-28px) scale(.82);} 15.3%,100%{opacity:0;transform:translate(0,0) scale(1);} }
    @keyframes ec-t2 { 0%,15.05%{opacity:0;transform:translate(0,0) scale(1);} 15.1%{opacity:.25;transform:translate(0,-52px) scale(.65);} 15.3%,100%{opacity:0;transform:translate(0,0) scale(1);} }
    @keyframes ec-b1 { 0%,14.9%{opacity:0;transform:translate(0,0) scale(1);} 15%{opacity:.6;transform:translate(0,28px) scale(.82);} 15.3%,100%{opacity:0;transform:translate(0,0) scale(1);} }
    @keyframes ec-b2 { 0%,15.05%{opacity:0;transform:translate(0,0) scale(1);} 15.1%{opacity:.25;transform:translate(0,52px) scale(.65);} 15.3%,100%{opacity:0;transform:translate(0,0) scale(1);} }
    @keyframes sw-l { 0%,47.9%{opacity:0;transform:translateX(0);} 48%{opacity:.9;transform:translateX(0);} 48.6%{opacity:.4;transform:translateX(-50px);} 49%,100%{opacity:0;transform:translateX(-70px);} }
    @keyframes sw-r { 0%,47.9%{opacity:0;transform:translateX(0);} 48%{opacity:.9;transform:translateX(0);} 48.6%{opacity:.4;transform:translateX(50px);} 49%,100%{opacity:0;transform:translateX(70px);} }
    @keyframes sw-l2 { 0%,48.1%{opacity:0;transform:translateX(0);} 48.2%{opacity:.4;transform:translateX(0);} 48.8%{opacity:.1;transform:translateX(-100px);} 49%,100%{opacity:0;transform:translateX(-120px);} }
    @keyframes sw-r2 { 0%,48.1%{opacity:0;transform:translateX(0);} 48.2%{opacity:.4;transform:translateX(0);} 48.8%{opacity:.1;transform:translateX(100px);} 49%,100%{opacity:0;transform:translateX(120px);} }
    @keyframes sw-sl1 { 0%,47.9%{opacity:0;transform:translate(0);} 48%{opacity:1;transform:translate(-28px,0);} 48.5%{opacity:1;transform:translate(18px,0);} 49%,100%{opacity:0;transform:translate(0);} }
    @keyframes sw-sl2 { 0%,47.9%{opacity:0;transform:translate(0);} 48%{opacity:1;transform:translate(24px,0);} 48.5%{opacity:1;transform:translate(-16px,0);} 49%,100%{opacity:0;transform:translate(0);} }
    @keyframes glitch-r { 0%,79.9%{opacity:0;transform:translate(0,0);} 80%{opacity:.8;transform:translate(-5px,2px);} 81%{opacity:.8;transform:translate(4px,-2px);} 82%{opacity:.8;transform:translate(-3px,1px);} 83%,100%{opacity:0;transform:translate(0,0);} }
    @keyframes glitch-b { 0%,79.9%{opacity:0;transform:translate(0,0);} 80%{opacity:.8;transform:translate(5px,-2px);} 81%{opacity:.8;transform:translate(-4px,2px);} 82%{opacity:.8;transform:translate(3px,-1px);} 83%,100%{opacity:0;transform:translate(0,0);} }
  </style>

  <g class="glitch-frame">
    <!-- Path instead of rect to allow open bottom -->
    <path class="frame-border" d="M1 160 L1 4 Q1 1 4 1 L996 1 Q999 1 999 4 L999 160" fill="#0a0a0a" />
    <text class="title-txt" x="15" y="18">AUTHORIZED_SESSION // IDENTITY: HERAS_L</text>
  </g>

  <g transform="translate(500, 94)">
    <text class="title glitch-r">I AM LAWRENCE HERAS</text>
    <text class="title glitch-b">I AM LAWRENCE HERAS</text>
    <text class="title sw-l2">I AM LAWRENCE HERAS</text>
    <text class="title sw-r2">I AM LAWRENCE HERAS</text>
    <text class="title sw-l">I AM LAWRENCE HERAS</text>
    <text class="title sw-r">I AM LAWRENCE HERAS</text>
    <text class="title sw-sl1">I AM LAWRENCE HERAS</text>
    <text class="title sw-sl2">I AM LAWRENCE HERAS</text>
    <text class="title ec-t2">I AM LAWRENCE HERAS</text>
    <text class="title ec-t1">I AM LAWRENCE HERAS</text>
    <text class="title ec-b1">I AM LAWRENCE HERAS</text>
    <text class="title ec-b2">I AM LAWRENCE HERAS</text>
    <text class="title sl-1">I AM LAWRENCE HERAS</text>
    <text class="title sl-2">I AM LAWRENCE HERAS</text>
    <text class="title sl-3">I AM LAWRENCE HERAS</text>
    <text class="title sl-4">I AM LAWRENCE HERAS</text>
    <text class="title base">I AM LAWRENCE HERAS</text>
  </g>
</svg>
