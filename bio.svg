<svg xmlns="http://www.w3.org/2000/svg" width="850" height="80" viewBox="0 0 850 80">
  <style>
    .frame { fill: #0a0a0a; stroke: #8c00ff; stroke-width: 2; }
    .text { font-family: 'Courier New', monospace; font-size: 14px; fill: #8c00ff; opacity: 0.8; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .cursor { animation: blink 1s infinite; fill: #8c00ff; }
  </style>
  <rect class="frame" width="850" height="80" rx="8" />
  <text class="text" x="20" y="35">
    <tspan x="20" dy="0">&gt; I have a crippling impostor syndrome...</tspan>
    <tspan x="20" dy="20">&gt; and chronic brainrot...</tspan>
    <tspan class="cursor">_</tspan>
  </text>
</svg>
